<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">How a groundwater water point works</title><desc id="d">Conceptual cross-section showing rainfall, aquifer, borehole casing, hand pump, and water delivery.</desc>
<rect width="1200" height="540" rx="24" fill="#f4f8f7"/><text x="48" y="54" font-family="Arial" font-size="28" font-weight="700" fill="#163b46">A water point is a connected system</text><text x="48" y="82" font-family="Arial" font-size="15" fill="#58727a">Simplified groundwater borehole and hand-pump cross-section · not to scale</text>
<rect x="0" y="180" width="1200" height="360" fill="#d8c7a6"/><path d="M0 180 Q150 165 300 180 T600 180 T900 180 T1200 180" fill="none" stroke="#7c9d62" stroke-width="12"/>
<rect x="0" y="350" width="1200" height="190" fill="#a7cbd0" opacity=".85"/><path d="M0 350 Q160 340 320 350 T640 350 T960 350 T1200 350" fill="none" stroke="#4e9aa6" stroke-width="4" stroke-dasharray="12 8"/>
<text x="55" y="420" font-family="Arial" font-size="25" font-weight="700" fill="#225e6a">Groundwater-bearing zone / aquifer</text>
<g stroke="#3b4b4e" stroke-width="7" fill="none"><path d="M485 180V445H555V180"/><path d="M485 180H555"/></g><rect x="502" y="185" width="36" height="250" fill="#eaf3f3"/><path d="M520 440V225" stroke="#3c94a1" stroke-width="10"/>
<g stroke="#304b52" stroke-width="9" fill="none" stroke-linecap="round"><path d="M520 180V135H625"/><path d="M625 135V160"/><path d="M520 135H450"/><path d="M450 135V165"/></g><rect x="470" y="160" width="100" height="26" rx="7" fill="#536f77"/>
<path d="M520 160 Q540 120 580 160" stroke="#2b8691" stroke-width="6" fill="none"/>
<g fill="#246e79" font-family="Arial"><text x="670" y="132" font-size="22" font-weight="700">Hand-pump mechanism</text><text x="670" y="158" font-size="16">Handle, piston, seals, and valves lift water</text><text x="670" y="230" font-size="22" font-weight="700">Borehole and casing</text><text x="670" y="256" font-size="16">Protect and provide access to the groundwater</text><text x="670" y="325" font-size="22" font-weight="700">Water availability</text><text x="670" y="351" font-size="16">Depends on source, recharge, season, and local geology</text></g>
<g stroke="#2b8691" stroke-width="5" fill="none"><path d="M555 175H610V195H650"/><path d="M640 185L650 195L640 205"/></g>
<g fill="#2c5c40" font-family="Arial" font-size="17"><text x="60" y="145">Land surface</text><text x="60" y="225">Soil and unsaturated ground</text></g>
<g fill="#4b8590"><path d="M170 95l-18 34h13l-8 24 27-38h-15l12-20z"/><path d="M270 95l-18 34h13l-8 24 27-38h-15l12-20z"/></g><text x="60" y="65" fill="#397d8a" font-family="Arial" font-size="18">Rainfall can replenish some groundwater systems</text>
<g stroke="#3c94a1" stroke-width="3" stroke-dasharray="8 8" fill="none"><path d="M180 155L180 330L330 390"/><path d="M280 155L280 330L390 390"/></g>
<text x="70" y="505" fill="#345c64" font-family="Arial" font-size="16">A working pump does not by itself guarantee adequate yield or safe drinking water.</text>
</svg>